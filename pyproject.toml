[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verqen-labeler"
version = "1.0.0"
description = "Certified data labeling with conformal coverage guarantees, powered by VerQen-T2"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ZorQelis AI" }]
keywords = ["data-labeling", "conformal-prediction", "active-learning", "labeling", "verqen"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
gpu = ["torch>=2.5", "safetensors>=0.4"]
datasets = ["datasets>=2.19"]
label-studio = ["label-studio-sdk>=0.0.30"]
dev = ["pytest>=8.0", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/ZorQelis-AI/verqen-labeler"
Repository = "https://github.com/ZorQelis-AI/verqen-labeler"
Documentation = "https://github.com/ZorQelis-AI/verqen-labeler#readme"
"Bug Tracker" = "https://github.com/ZorQelis-AI/verqen-labeler/issues"

[tool.setuptools.packages.find]
include = ["verqen_labeler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: tests that need a local VerQen checkpoint (set VERQEN_CHECKPOINT)",
]
